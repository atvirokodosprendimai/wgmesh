version: 2

project_name: wgmesh

before:
  hooks:
    - go mod download

builds:
  - id: wgmesh
    main: .
    binary: wgmesh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

nfpms:
  - id: packages
    package_name: wgmesh
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: atvirokodosprendimai
    homepage: https://github.com/atvirokodosprendimai/wgmesh
    maintainer: atvirokodosprendimai <atvirokodosprendimai@users.noreply.github.com>
    description: |-
      WireGuard mesh network — decentralized peer discovery and encrypted networking.
      Zero-infrastructure anycast CDN built on WireGuard.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - wireguard-tools
    recommends:
      - iptables
    contents:
      - src: packaging/wgmesh.service
        dst: /lib/systemd/system/wgmesh.service
      - dst: /etc/wgmesh
        type: dir
        file_info:
          mode: 0700
      - dst: /var/lib/wgmesh
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

brews:
  - repository:
      owner: atvirokodosprendimai
      name: homebrew-tap
      token: "{{ .Env.PUSH_TOKEN }}"
    directory: Formula
    name: wgmesh
    homepage: https://github.com/atvirokodosprendimai/wgmesh
    description: "WireGuard mesh network — decentralized peer discovery and encrypted networking"
    license: MIT
    dependencies:
      - name: wireguard-go
      - name: wireguard-tools
    install: |
      bin.install "wgmesh"
      # Writable, user-owned dirs under the Homebrew prefix: the secret file
      # and account/services state. The launchd service (root) reads/writes both.
      (etc/"wgmesh").mkpath
      (var/"wgmesh").mkpath
    test: |
      system "#{bin}/wgmesh", "version"
    service: |
      run [opt_bin/"wgmesh", "join", "--state-dir", var/"wgmesh"]
      keep_alive true
      run_type :immediate
      require_root true
      log_path var/"log"/"wgmesh.log"
      error_log_path var/"log"/"wgmesh.log"
      environment_variables({"WGMESH_SECRET_FILE" => etc/"wgmesh"/"secret"})
    caveats: |
      wgmesh runs as a root launchd service via `brew services` - root is
      required to create the utun interface and WireGuard routes.

      Bootstrap on macOS:
        1. wgmesh init --secret --save-to #{etc}/wgmesh/secret
        2. brew services start wgmesh    # prompts for your password (LaunchDaemon)

      The daemon starts at boot and restarts if it crashes.

      Logs:   #{var}/log/wgmesh.log
      State:  #{var}/wgmesh (account/services) and /var/lib/wgmesh (node identity)

      Stop:       brew services stop wgmesh
      Restart:    brew services restart wgmesh
      Uninstall:  brew uninstall wgmesh
    commit_msg_template: "Update wgmesh formula to {{ .Tag }}"
    skip_upload: auto

checksum:
  name_template: "checksums.txt"

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^memory:"
      - "^loop:"
      - "^chore:"
      - typo

release:
  github:
    owner: atvirokodosprendimai
    name: wgmesh
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
