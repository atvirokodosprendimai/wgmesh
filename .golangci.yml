# golangci-lint v2 configuration.
# Local: `make lint`. CI: .github/workflows/ci.yml runs the same binary via
# golangci-lint-action (fresh runner). Local runs may flake on a warm cache;
# `golangci-lint cache clean` before trusting a result.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  exclusions:
    rules:
      # Best-effort resource/socket classes: closing, stopping, flushing and
      # deadline/buffer tuning never warrant error handling in this codebase.
      - text: 'Error return value of `[^`]*(Close|Stop|Flush|SetReadDeadline|SetWriteDeadline|SetReadBuffer|WriteToUDP)[^`]*`'
        linters: [errcheck]
          # fmt.Fprint* covers two cases, both deliberately unchecked: (1) stdio
          # writes from the CLI and tests, which are best-effort by nature, and
          # (2) fmt.Fprintf(&sb, ...) on strings.Builder, whose Write methods
          # never fail per docs. Writer-side Close errors (e.g. the analytics
          # logger's deferred file close) are NOT covered by this rule — they
          # are real persistence errors and must be handled, not suppressed.
      - text: 'Error return value of `fmt\.(Fprintln|Fprintf|Fprint)`'
        linters: [errcheck]
